name: CI

# The merge gate for pull requests into main, and a continuous check on dev.
# Compiles, lints, tests, and builds the frontend (debug build only, no
# bundling); releases are cut from main by release.yml.
#
# Running on dev pushes as well keeps this in step with Synapt's workflow, and
# means work is validated on Linux as it lands rather than only once a release
# PR is opened. Actions minutes are free on public repositories.
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      # SynaptClip's src-tauri/Cargo.toml references synapt-core via
      # path = "../../synapt-core". Checking both out side by side reproduces the
      # local directory layout so the path dependency resolves.
      - name: Checkout synapt-clip
        uses: actions/checkout@v4
        with:
          path: synapt-clip

      - name: Checkout synapt-core
        uses: actions/checkout@v4
        with:
          repository: aatishbagal/synapt-core
          path: synapt-core
          # If synapt-core is PRIVATE, the default GITHUB_TOKEN cannot read it.
          # Create a fine-grained PAT with read access to synapt-core, store it
          # as a repo secret named SYNAPT_CORE_TOKEN, and uncomment the next line.
          # token: ${{ secrets.SYNAPT_CORE_TOKEN }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libxdo-dev \
            file \
            wget

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: synapt-clip/package-lock.json

      - name: Set up Rust
        # Pinned for reproducible clippy: floating @stable lets new clippy
        # releases introduce lints that break -D warnings with no code change.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: synapt-clip/src-tauri

      - name: Install frontend dependencies
        working-directory: synapt-clip
        run: npm ci

      - name: Clippy
        working-directory: synapt-clip/src-tauri
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: synapt-clip/src-tauri
        run: cargo test

      - name: Frontend build
        working-directory: synapt-clip
        run: npm run build

      - name: Debug build
        working-directory: synapt-clip/src-tauri
        run: cargo build
