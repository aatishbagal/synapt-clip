name: Release

# Fires when a version tag is pushed (e.g. v0.4.1). Pushing the tag is the
# deliberate "make a release" signal.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      # SynaptClip's src-tauri/Cargo.toml references synapt-core via
      # path = "../../synapt-core". Checking both out side by side reproduces the
      # local directory layout so the path dependency resolves.
      - name: Checkout synapt-clip
        uses: actions/checkout@v4
        with:
          path: synapt-clip

      - name: Checkout synapt-core
        uses: actions/checkout@v4
        with:
          repository: aatishbagal/synapt-core
          path: synapt-core
          # If synapt-core is PRIVATE, the default GITHUB_TOKEN cannot read it.
          # Create a fine-grained PAT with read access to synapt-core, store it
          # as a repo secret named SYNAPT_CORE_TOKEN, and uncomment the next line.
          # token: ${{ secrets.SYNAPT_CORE_TOKEN }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libxdo-dev \
            file \
            wget

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: synapt-clip/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: synapt-clip/src-tauri

      - name: Install frontend dependencies
        working-directory: synapt-clip
        run: npm ci

      # tauri-action builds the bundles for the current platform (Linux: .deb +
      # .AppImage, Windows: .msi + .exe NSIS installer) and uploads them as
      # assets on the release for the pushed tag, creating it if needed.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: synapt-clip
          tagName: ${{ github.ref_name }}
          releaseName: SynaptClip ${{ github.ref_name }}
          releaseBody: Download the installer for your platform below.
          releaseDraft: false
          prerelease: false
